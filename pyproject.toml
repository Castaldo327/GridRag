[project]
name = "gridrag"
version = "0.1.0"
description = "Synthetic grid warehouse queried in natural language"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=3.35,<4",
    "pydantic>=2.14,<3",
    "pandas~=2.2",
    "numpy>=1.26",
    "duckdb>=2.0.0",
]

[project.optional-dependencies]
eval = [
    "qdrant-client[fastembed]>=1.16,<1.18",
]

[tool.uv]
package = false
